# Project config for Codex (the Skeptic). The template starts the Skeptic in
# this folder (agents/skeptic), so this lockdown never applies to people
# working on the repo itself. Codex loads project-scoped config and
# .codex/rules/ only when this project is trusted
# (https://learn.chatgpt.com/docs/config-file/config-reference,
#  https://learn.chatgpt.com/docs/agent-configuration/rules).
#
# The Skeptic only reads: `python -m proveit evidence|show|list|tally`. It
# records concur / dispute by posting `@prove-it-intake concur R-001` in
# #proveit-triage, where Switch vouches for the sender, so it never needs to
# write a file.
#
# Reporter material, Intake's credentials and the sandbox's staging mounts
# live in ~/.proveit/<checkout>/ (see proveit/config.py). The permission
# profile below makes the OS sandbox refuse every read there, whatever command
# the Skeptic runs, and refuses all writes except the temp folder.
# Checked with Codex 0.166:
#   codex sandbox -c 'default_permissions="proveit_skeptic"' -- cat ~/.proveit/...  ->  Operation not permitted

# Fallback if a Codex version ignores permission profiles: no writes anywhere.
sandbox_mode = "read-only"
default_permissions = "proveit_skeptic"

[permissions.proveit_skeptic]
filesystem = { ":root" = "read", ":tmpdir" = "write", "~/.proveit" = "none" }
network = { enabled = false }

[shell_environment_policy]
# Belt and braces. agents/skeptic/proveit/ already makes `python -m proveit` work
# from this folder and fixes the Skeptic role even when a session does not apply
# these (the Switch-managed session on 2026-11-07 did not: "No module named
# proveit"). PROVEIT_ACTOR and PROVEIT_AGENT limit the CLI to read-only commands.
set = { PROVEIT_ACTOR = "agent", PROVEIT_AGENT = "skeptic", PYTHONPATH = "../..", PYTHONDONTWRITEBYTECODE = "1" }
